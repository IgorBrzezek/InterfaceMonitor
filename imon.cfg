# ============================================================================
# IMon — Interface Monitor configuration file
# ============================================================================
# Place this file alongside IMon.py or in ~/.imon.cfg
# This is standard INI format (configparser).

[general]
# Screen refresh interval in milliseconds (500-5000)
refresh_interval_ms = 1000

# Color mode: vga (full color), hgc (amber monochrome), mono (black & white)
color_mode = vga

# Background fill character (space by default)
# Characters in DOS-Style: ░ ▒ ▓ 
background_char = ▓

[display]
# Whether to show the loopback (lo) interface
show_loopback = false

# Whether to fetch and display the public IP in the top bar
show_public_ip = false

# Status bar configuration
show_hostname = true
# Show date/time in bottom bar
show_datetime = true
# Show interface count in bottom bar
show_iface_count = true
# strftime format for date/time
#datetime_format = %d-%m-%Y %H:%M:%S
datetime_format = %d-%m-%Y %H:%M


# Column widths for the Interfaces window
interface_name_width = 12
mac_width = 17
ipv4_width = 18
gateway_width = 15
ipv6_width = 25

# Column widths for the Traffic window (rate and total)
traffic_rate_width = 10
traffic_total_width = 10

# Comma-separated list of interfaces to monitor (all / empty / missing = all)
interfaces = all

[colors]
# Background color for the entire screen
background = black

# Status bars (top and bottom)
status_bar_top = white,blue
status_bar_bottom = white,blue

# Window borders and titles
border = cyan,black
border_title = yellow,black

# General text colors
text_normal = white,black
text_label = cyan,black
text_value = green,black
text_warning = yellow,black
text_error = red,black

# Highlight color for selection
highlight = black,cyan

# Traffic rate colors (Up = upload, Dn = download)
traffic_up = green,black
traffic_dn = yellow,black

# DHCP / STATIC indicators
dhcp_color = green,black
static_color = magenta,black

# Interface state colors
state_down = red,black
state_up_noip = yellow,black
state_down_hasip = magenta,black

# Table header background
header_bg = blue

# Public IP display colors
public_ip_normal = white,blue
public_ip_error = red,black
public_ip_refreshing = yellow,black
public_ip_acquiring = yellow,blue
# Individual override options for acquisition colors:
#IPacquisition_fg_color = yellow
#IPacquisition_bg_color = blue

# HGC color mode RGB values (R,G,B 0-255)
hgc_color = 235,143,52
hgc_highlight = 235,186,52

[keys]
# Single-character keys (case-insensitive)
quit = q
help = h
toggle_pause = p
info = i
ping = n
traceroute = t
credits = c
dns = d
toggle_public_ip = a

[ping]
# Ping bar thresholds in milliseconds
bar_green_below = 15
bar_yellow_below = 30
bar_orange_below = 60
bar_magenta_below = 100
bar_red_below = 500

# Bar segment colors (foreground,background)
color_green = green,black
color_yellow = yellow,black
color_orange = yellow,black
color_magenta = magenta,black
color_red = red,black
color_critical = red,black

[popup]
# Popup window interior background
background = white,black
# Border color (foreground,background)
border_color = cyan,black
# Use double-line border (true) or single-line (false)
border_double = true

[traceroute]
# Traceroute program to use. Allowed: tracepath, traceroute, mtr
command = mtr

[network]
# How often to refresh traffic counters (seconds)
traffic_interval = 1.0

# How often to refresh interface list and config (seconds)
interface_interval = 5.0

# How often to refresh the public IP address (seconds)
public_ip_refresh_interval = 5.0
